services:
  - type: web
    name: discord-music-bot
    runtime: python
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.11.0
