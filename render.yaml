services:
  - type: worker
    name: discord-music-bot
    runtime: python
    buildCommand: |
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      npm install -g npm
      pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.8
